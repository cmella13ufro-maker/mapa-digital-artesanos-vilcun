if(a.facebook)popup+='<a class="popup-link facebook" href="'+a.facebook+'" target="_blank">Facebook</a>';
if(a.whatsapp){let num=a.whatsapp.replace(/\D/g,'');popup+='<a class="popup-link whatsapp" href="https://api.whatsapp.com/send?phone='+num+'" target="_blank">WhatsApp</a>';}
if(Array.isArray(a.coords)&&a.coords.length===2)popup+='<a class="popup-link maps" href="https://www.google.com/maps?q='+a.coords[0]+','+a.coords[1]+'" target="_blank">Cómo llegar</a>';
return popup;
}

var galeriaFotos=[],galeriaIndice=0;
function abrirGaleria(imagen,lista){galeriaFotos=lista||[imagen];galeriaIndice=galeriaFotos.indexOf(imagen);if(galeriaIndice<0)galeriaIndice=0;var overlay=document.createElement('div');overlay.className='galeria-overlay';overlay.id='galeria-overlay';overlay.innerHTML='<button class="galeria-cerrar" type="button" onclick="cerrarGaleria()">×</button><button class="galeria-flecha galeria-prev" type="button" onclick="galeriaAnterior()">‹</button><img id="galeria-imagen" src="'+galeriaFotos[galeriaIndice]+'"><button class="galeria-flecha galeria-next" type="button" onclick="galeriaSiguiente()">›</button>';overlay.onclick=function(e){if(e.target===overlay)cerrarGaleria();};document.body.appendChild(overlay);}
function actualizarGaleria(){var img=document.getElementById('galeria-imagen');if(img)img.src=galeriaFotos[galeriaIndice];}
function galeriaAnterior(){if(galeriaFotos.length){galeriaIndice=(galeriaIndice-1+galeriaFotos.length)%galeriaFotos.length;actualizarGaleria();}}
function galeriaSiguiente(){if(galeriaFotos.length){galeriaIndice=(galeriaIndice+1)%galeriaFotos.length;actualizarGaleria();}}
function cerrarGaleria(){var overlay=document.getElementById('galeria-overlay');if(overlay)overlay.remove();}

var markers=[],danielaMarker=null;
function ocultarSimbologia(){var s=document.getElementById('simbologia');if(s)s.classList.add('simbologia-oculta');}
function mostrarSimbologia(){var s=document.getElementById('simbologia');if(s)s.classList.remove('simbologia-oculta');}
function controlarZoomAlAbrirPopup(e){ocultarSimbologia();map.touchZoom.disable();var z=document.querySelector(".leaflet-control-zoom");if(z)z.style.display="none";var p=e.popup.getElement();if(p){L.DomEvent.disableClickPropagation(p);L.DomEvent.disableScrollPropagation(p);}}
function controlarZoomAlCerrarPopup(){map.touchZoom.enable();var z=document.querySelector(".leaflet-control-zoom");if(z)z.style.display="";mostrarSimbologia();}
map.on("popupopen",controlarZoomAlAbrirPopup);
map.on("popupclose",controlarZoomAlCerrarPopup);
artesanos.forEach(function(a){
if(!Array.isArray(a.coords)||a.coords.length!==2)return;
if(a.artesana==="Daniela Colli Huenchumilla"){
if(!danielaMarker){danielaMarker=L.marker(a.coords,{icon:icons.daniela}).addTo(map);danielaMarker.on('click',ocultarSimbologia);danielaMarker.coords=a.coords;danielaMarker.emprendimientos=[a];markers.push(danielaMarker);}
else danielaMarker.emprendimientos.push(a);
return;
}
var marker=L.marker(a.coords,{icon:icons[a.tipo]||icons.textil}).addTo(map);marker.coords=a.coords;marker.emprendimientos=[a];marker.bindPopup(crearPopup(a));marker.on('click',ocultarSimbologia);marker.on('popupopen',function(e){controlarZoomAlAbrirPopup(e);});
marker.on('popupclose',controlarZoomAlCerrarPopup);markers.push(marker);
});

function popupDaniela(){
return '<div class="popup-title">📍 Daniela Colli</div><div class="popup-subtitle">Selecciona un emprendimiento</div><button type="button" class="popup-link maps boton-patranka"><img class="emprendimiento-icono" src="ICONOS RUBRO/icono_platería_mapuche_.png">Patranka Artesanal</button><button type="button" class="popup-link instagram boton-rayun"><img class="emprendimiento-icono" src="ICONOS RUBRO/icono_acrilico.png">Rayün Expresión Artística</button>';
}
if(danielaMarker){
danielaMarker.bindPopup(popupDaniela());
danielaMarker.on('popupopen',function(e){
controlarZoomAlAbrirPopup(e);
var p=e.popup.getElement();if(!p)return;
var bp=p.querySelector('.boton-patranka'),br=p.querySelector('.boton-rayun');
if(bp)bp.onclick=function(e){L.DomEvent.stop(e);mostrarEmprendimiento(danielaMarker.coords,0);};
if(br)br.onclick=function(e){L.DomEvent.stop(e);mostrarEmprendimiento(danielaMarker.coords,1);};
});
danielaMarker.on('popupclose',controlarZoomAlCerrarPopup);
}

function mostrarEmprendimiento(coords,indice){
let datos=artesanos.filter(a=>(a.nombre==="Patranka Artesanal"||a.nombre==="Rayün Expresión Artística")&&Array.isArray(a.coords)&&a.coords.length===2&&a.coords[0]===coords[0]&&a.coords[1]===coords[1]);
if(!datos[indice])return;
let marker=markers.find(m=>m.coords[0]===coords[0]&&m.coords[1]===coords[1]);if(!marker)return;
let popup=crearPopup(datos[indice])+'<br><button type="button" class="popup-link maps boton-volver">🔙 Ver los otros emprendimientos</button>';
marker.setPopupContent(popup);marker.openPopup();
setTimeout(function(){let p=marker.getPopup().getElement();if(!p)return;L.DomEvent.disableClickPropagation(p);let b=p.querySelector('.boton-volver');if(b)b.onclick=function(e){e.preventDefault();e.stopPropagation();mostrarOpcionesDaniela(coords);};},50);
}
function mostrarOpcionesDaniela(coords){
let marker=markers.find(m=>m.coords[0]===coords[0]&&m.coords[1]===coords[1]);if(!marker)return;
marker.setPopupContent(popupDaniela());marker.openPopup();
setTimeout(function(){let p=marker.getPopup().getElement();if(!p)return;L.DomEvent.disableClickPropagation(p);let bp=p.querySelector('.boton-patranka'),br=p.querySelector('.boton-rayun');if(bp)bp.onclick=function(e){L.DomEvent.stop(e);mostrarEmprendimiento(coords,0);};if(br)br.onclick=function(e){L.DomEvent.stop(e);mostrarEmprendimiento(coords,1);};},50);
}

function abrirPerfilDesdeDirectorio(indice){
var a=artesanos[indice];if(!a)return;
ocultarSimbologia();
var panel=document.getElementById('directorio-panel');if(panel)panel.style.display='none';
if((a.nombre==="Patranka Artesanal"||a.nombre==="Rayün Expresión Artística")&&Array.isArray(a.coords)&&a.coords.length===2){map.setView(a.coords,Math.max(map.getZoom(),14));L.popup({maxWidth:620,closeButton:true}).setLatLng(a.coords).setContent(crearPopup(a)).openOn(map);return;}
if(Array.isArray(a.coords)&&a.coords.length===2){map.setView(a.coords,Math.max(map.getZoom(),14));var marker=markers.find(function(m){return m.coords&&m.coords[0]===a.coords[0]&&m.coords[1]===a.coords[1];});if(marker)marker.openPopup();return;}
L.popup({maxWidth:520}).setLatLng(map.getCenter()).setContent(crearPopup(a)).openOn(map);
}
function construirDirectorio(){
var panel=document.getElementById('directorio-panel');if(!panel)return;
var html='<div class="directorio-head">Emprendimientos <button type="button" class="directorio-cerrar" onclick="cerrarDirectorio()">×</button></div>';
artesanos.forEach(function(a,indice){var nombre=a.nombre;if(a.artesano==="Claudio Ovando Leon")nombre+=" - Digital";html+='<div class="directorio-item"><span class="directorio-nombre">'+nombre+'</span><button type="button" class="directorio-ver" onclick="abrirPerfilDesdeDirectorio('+indice+')">Ver perfil</button></div>';});
panel.innerHTML=html;
}
function cerrarDirectorio(){var panel=document.getElementById('directorio-panel');if(panel)panel.style.display='none';}
construirDirectorio();
document.getElementById('directorio-btn').onclick=function(e){e.stopPropagation();var panel=document.getElementById('directorio-panel');if(panel)panel.style.display=panel.style.display==='block'?'none':'block';};
L.DomEvent.disableClickPropagation(document.getElementById('directorio-panel'));
if(markers.length>0){var group=L.featureGroup(markers);map.fitBounds(group.getBounds());}
</script>
</body>
</html>
