/* =====================================================
   CREAR POPUP
===================================================== */

function crearPopup(a){

    let popup = `

    <div class="popup-title">
    ${a.nombre}
    </div>

    <div class="popup-subtitle">
    ${a.artesana || a.artesano || ""}
    </div>

    <div>
    <b>Descripción:</b><br>
    ${a.descripcion}
    </div>

    <div>
    <b>Pago:</b><br>
    ${a.pago}
    </div>

    `;


    /* FOTOS */

    if(a.imagenes && a.imagenes.length > 0){

        a.imagenes.forEach(img=>{

            popup += `

            <img
            src="${img}"
            class="popup-img"
            >

            `;

        });

    }


    /* INSTAGRAM */

    if(a.instagram){

        popup += `

        <a
        class="popup-link instagram"
        href="${a.instagram}"
        target="_blank"
        >
        Instagram
        </a>

        `;

    }


    /* FACEBOOK */

    if(a.facebook){

        popup += `

        <a
        class="popup-link facebook"
        href="${a.facebook}"
        target="_blank"
        >
        Facebook
        </a>

        `;

    }


    /* WHATSAPP */

    if(a.whatsapp){

        let num = a.whatsapp.replace(/\D/g,'');

        popup += `

        <a
        class="popup-link whatsapp"
        href="https://api.whatsapp.com/send?phone=${num}"
        target="_blank"
        >
        WhatsApp
        </a>

        `;

    }


    /* GOOGLE MAPS */

    if(
        Array.isArray(a.coords) &&
        a.coords.length === 2
    ){

        popup += `

        <a
        class="popup-link maps"
        href="https://www.google.com/maps?q=${a.coords[0]},${a.coords[1]}"
        target="_blank"
        >
        Cómo llegar
        </a>

        `;

    }


    return popup;

}


/* =====================================================
   MARCADORES
===================================================== */

var markers = [];
var danielaMarker = null;

artesanos.forEach(function(a){

    if(!Array.isArray(a.coords) || a.coords.length !== 2){
        return;
    }

    /* DANIELA: UN SOLO MARCADOR PARA SUS DOS EMPRENDIMIENTOS */
    if(a.artesana === "Daniela Colli Huenchumilla"){

        if(!danielaMarker){
            danielaMarker = L.marker(a.coords, { icon:icons.daniela }).addTo(map);
            danielaMarker.coords = a.coords;
            danielaMarker.emprendimientos = [a];
            markers.push(danielaMarker);
        }else{
            danielaMarker.emprendimientos.push(a);
        }
        return;
    }

    var marker = L.marker(a.coords, { icon:icons[a.tipo] || icons.textil }).addTo(map);
    marker.coords = a.coords;
    marker.emprendimientos = [a];
    marker.bindPopup(crearPopup(a));
    marker.on('popupopen', function(e){
        var popupElement = e.popup.getElement();
        if(popupElement){
            L.DomEvent.disableClickPropagation(popupElement);
        }
    });
    markers.push(marker);
});

/* =====================================================
   POPUP INICIAL DE DANIELA
===================================================== */

if(danielaMarker){

    danielaMarker.bindPopup(`
        <div class="popup-title">
        📍 Daniela Colli
        </div>
        <div class="popup-subtitle">
        Selecciona un emprendimiento
        </div>
        <button type="button" class="popup-link maps boton-patranka">
        💍 Patranka Artesanal
        </button>
        <button type="button" class="popup-link instagram boton-rayun">
        🧶 Rayün Expresión Artística
        </button>
    `);

    danielaMarker.on('popupopen', function(e){
        var popupElement = e.popup.getElement();
        if(!popupElement){ return; }
        L.DomEvent.disableClickPropagation(popupElement);

        var botonPatranka = popupElement.querySelector(".boton-patranka");
        var botonRayun = popupElement.querySelector(".boton-rayun");

        if(botonPatranka){
            botonPatranka.onclick = function(e){
                e.preventDefault();
                e.stopPropagation();
                mostrarEmprendimiento(danielaMarker.coords, 0);
            };
        }

        if(botonRayun){
            botonRayun.onclick = function(e){
                e.preventDefault();
                e.stopPropagation();
                mostrarEmprendimiento(danielaMarker.coords, 1);
            };
        }
    });
}

/* =====================================================
   GUARDAR EMPRENDIMIENTOS DE DANIELA
===================================================== */

let danielaMarkers =
    markers.filter(m =>

        m.emprendimientos &&

        m.emprendimientos.length > 0 &&

        m.emprendimientos[0].artesana ===
        "Daniela Colli Huenchumilla"

    );


if(danielaMarkers.length > 0){

    let emprendimientos = [];


    artesanos.forEach(a=>{

        if(

            a.artesana ===
            "Daniela Colli Huenchumilla"

            &&

            Array.isArray(a.coords)

            &&

            a.coords.length === 2

        ){

            emprendimientos.push(a);

        }

    });


    danielaMarkers[0].emprendimientos =
        emprendimientos;

}


/* =====================================================
   MOSTRAR EMPRENDIMIENTO
===================================================== */

function mostrarEmprendimiento(
    coords,
    indice
){

    let datos =
        artesanos.filter(a =>

            a.artesana ===
            "Daniela Colli Huenchumilla"

            &&

            Array.isArray(a.coords)

            &&

            a.coords.length === 2

            &&

            a.coords[0] === coords[0]

            &&

            a.coords[1] === coords[1]

        );


    if(!datos[indice]){

        return;

    }


    let marker =
        markers.find(m =>

            m.coords[0] === coords[0]

            &&

            m.coords[1] === coords[1]

        );


    if(!marker){

        return;

    }


    /* CREAR FICHA */

    let popup =
        crearPopup(
            datos[indice]
        );


    /* BOTÓN VOLVER */

    popup += `

    <br>

    <button
    type="button"
    class="popup-link maps boton-volver"
    >

    🔙 Ver los otros emprendimientos

    </button>

    `;


    /* CAMBIAR CONTENIDO */

    marker.setPopupContent(popup);

    marker.openPopup();


    /* ESPERAR A QUE LEAFLET RENDERICE */

    setTimeout(
        function(){

            let popupElement =
                marker.getPopup().getElement();


            if(!popupElement){

                return;

            }


            /* PROTEGER POPUP */

            L.DomEvent.disableClickPropagation(
                popupElement
            );


            /* BOTÓN VOLVER */

            let botonVolver =
                popupElement.querySelector(
                    ".boton-volver"
                );


            if(botonVolver){

                botonVolver.onclick =
                    function(e){

                        e.preventDefault();

                        e.stopPropagation();

                        mostrarOpcionesDaniela(
                            coords
                        );

                    };

            }

        },
        50
    );

}

            m.coords[1] === coords[1]

        );


    if(!marker){

        return;

    }


    /* CAMBIAR CONTENIDO */

    marker.setPopupContent(popup);

    marker.openPopup();


    /* CONFIGURAR BOTONES */

    setTimeout(
        function(){

            let popupElement =
                marker.getPopup().getElement();


            if(!popupElement){

                return;

            }


            /* PROTEGER POPUP */

            L.DomEvent.disableClickPropagation(
                popupElement
            );


            /* =========================================
               PATRANKA
            ========================================= */

            let botonPatranka =
                popupElement.querySelector(
                    ".boton-patranka"
                );


            if(botonPatranka){

                botonPatranka.onclick =
                    function(e){

                        e.preventDefault();

                        e.stopPropagation();

                        mostrarEmprendimiento(
                            coords,
                            0
                        );

                    };

            }


            /* =========================================
               RAYÜN
            ========================================= */

            let botonRayun =
                popupElement.querySelector(
                    ".boton-rayun"
                );


            if(botonRayun){

                botonRayun.onclick =
                    function(e){

                        e.preventDefault();

                        e.stopPropagation();

                        mostrarEmprendimiento(
                            coords,
                            1
                        );

                    };

            }

        },
        50
    );

}


/* =====================================================
   AJUSTAR MAPA
===================================================== */

if(markers.length > 0){

    var group =
        L.featureGroup(markers);

    map.fitBounds(
        group.getBounds()
    );

}

</script>

</body>

</html>
