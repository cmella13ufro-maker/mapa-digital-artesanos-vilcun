    font-weight:bold;
}

#map{

    width:100%;
}

.leaflet-popup-content-wrapper{
    border-radius:15px;
    border:3px solid #6b4f3b;
    background:#fffdf8;
}

.popup-title{
    font-size:20px;
    font-weight:bold;
    color:#6b4f3b;
}

.popup-subtitle{
    font-size:14px;
    color:#555;
    font-style:italic;
    margin-bottom:10px;
}

.popup-img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    margin:3px;
    border:2px solid #d6c2a8;
}

.popup-link{
    display:block;
    margin-top:8px;
    padding:8px;
    text-align:center;
    text-decoration:none;
    color:white;
    border-radius:8px;
    font-weight:bold;
}

.instagram{background:#c13584;}
.facebook{background:#1877F2;}
.whatsapp{background:#25d366;}
.maps{background:#4285F4;}

.leaflet-div-icon{
    background: transparent !important;
    border: none !important;
}

.pin-wrapper{
    position:relative;
    width:60px;
    height:60px;
}

.pin-circle{
    width:52px;
    height:52px;
    background:#2e7d32;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:3px solid white;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
    position:absolute;
    top:0;
    left:4px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.pin-circle img{
    width:32px;
    height:32px;
    object-fit:cover;
    border-radius:50%;
    transform:rotate(45deg);
    border:2px solid white;
}

var markers = [];

artesanos.forEach(a=>{
if(!Array.isArray(a.coords) || a.coords.length !== 2) return;

let popup = `
<div class="popup-title">${a.nombre}</div>
<div class="popup-subtitle">${a.artesana || a.artesano || ""}</div>
<div><b>Descripción:</b><br>${a.descripcion}</div>
<div><b>Pago:</b><br>${a.pago}</div>
`;

if(a.imagenes){
a.imagenes.forEach(img=>{
popup += `<img src="${img}" class="popup-img">`;
});
}

if(a.instagram){
popup += `<a class="popup-link instagram" href="${a.instagram}" target="_blank">Instagram</a>`;
}

if(a.facebook){
popup += `<a class="popup-link facebook" href="${a.facebook}" target="_blank">Facebook</a>`;
}

if(a.whatsapp){
let num = a.whatsapp.replace(/\D/g,'');
popup += `
<a class="popup-link whatsapp"
href="https://api.whatsapp.com/send?phone=${num}"
target="_blank">
WhatsApp
</a>`;
}

popup += `<a class="popup-link maps" href="https://www.google.com/maps?q=${a.coords[0]},${a.coords[1]}" target="_blank">Cómo llegar</a>`;

let marker = L.marker(a.coords,{icon:icons[a.tipo] || icons.textil})
.addTo(map)
.bindPopup(popup);

markers.push(marker);
});

if (markers.length > 0) {
var group = L.featureGroup(markers);
map.fitBounds(group.getBounds());
}
